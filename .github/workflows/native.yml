name: Native checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ${{ fromJSON(vars.NATIVE_RUNNER || '["xcode-27"]') }}
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      IOS_SLICE: ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain preflight
        run: |
          xcodebuild -version
          python3 - <<'PY'
          import re, subprocess
          version = subprocess.check_output(['xcodebuild', '-version'], text=True)
          match = re.search(r'Xcode (\d+)\.(\d+)', version)
          if not match or tuple(map(int, match.groups())) < (27, 1):
              raise SystemExit('Xcode 27.1+ required; the selected image must supply pinned 27.2.')
          PY
      - name: Install verified XcodeGen
        run: |
          curl --fail --location --retry 3 https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-release"
          echo "$RUNNER_TEMP/xcodegen-release/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Repository guards
        run: |
          python3 -m unittest discover -s Tests/Tooling -v
          python3 scripts/check-project.py
          node scripts/vocabulary/test-vocabulary.mjs
          node scripts/vocabulary/check-vocabulary.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parity reporter tests
        run: |
          npm ci --prefix scripts/parity
          npm test --prefix scripts/parity
      - name: Host package suites
        run: scripts/test.sh packages
      - name: Release archive and probe guard
        if: ${{ !cancelled() }}
        run: |
          scripts/build-draft.sh archive
          bash scripts/check-release-probes.sh "$HOME/Library/Developer/FiestaBoard/ios/FiestaBoard.xcarchive"
      - name: Record parity foundation status
        if: always()
        run: |
          mkdir -p build/parity
          echo '{"slice":"I2","goldens":"XCTest result is authoritative; missing golden fails","osMajor":"iOS27","figmaComparison":"reference unavailable; Connecting implementation deferred"}' > build/parity/foundation-status.json
          node scripts/parity/native-parity.mjs --shots build/parity --out build/parity/report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-foundation-and-parity
          path: |
            ~/Library/Developer/FiestaBoard/ios/results/ci
            build/parity
            Tests/__Snapshots__/iOS27
          retention-days: 14

  device-units:
    needs: foundation
    runs-on: ${{ fromJSON(vars.NATIVE_RUNNER || '["xcode-27"]') }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - device: iphone
            model: iPhone 17
          - device: ipad
            model: iPad Air 11-inch (M4)
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      IOS_SLICE: ci-units-${{ matrix.device }}
      IOS_TEST_MODEL: ${{ matrix.model }}
      IOS_TEST_SHARD: units
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: App-hosted, golden and renderer suites
        run: |
          xcodebuild -version
          scripts/test.sh simulators
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-units-${{ matrix.device }}
          path: |
            ~/Library/Developer/FiestaBoard/ios/results/${{ env.IOS_SLICE }}
            build/parity
            Tests/__Snapshots__/iOS27
          retention-days: 14

  device-ui:
    needs: device-units
    runs-on: ${{ fromJSON(vars.NATIVE_RUNNER || '["xcode-27"]') }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        device: [iphone, ipad]
        shard: [ui-a, ui-b, ui-c, ui-d]
        include:
          - device: iphone
            model: iPhone 17
          - device: ipad
            model: iPad Air 11-inch (M4)
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      IOS_SLICE: ci-${{ matrix.device }}-${{ matrix.shard }}
      IOS_TEST_MODEL: ${{ matrix.model }}
      IOS_TEST_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retained UI shard (serial XCTest)
        run: |
          xcodebuild -version
          scripts/test.sh simulators
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.device }}-${{ matrix.shard }}
          path: ~/Library/Developer/FiestaBoard/ios/results/${{ env.IOS_SLICE }}
          retention-days: 14

  # Preserve the protected check name; skipped/cancelled/failed prerequisites fail it.
  build-and-test:
    if: always()
    needs: [foundation, device-units, device-ui]
    runs-on: ${{ fromJSON(vars.NATIVE_RUNNER || '["xcode-27"]') }}
    timeout-minutes: 5
    env:
      FOUNDATION: ${{ needs.foundation.result }}
      UNITS: ${{ needs.device-units.result }}
      UI: ${{ needs.device-ui.result }}
    steps:
      - name: Require every suite and Release guard
        run: |
          [[ "$FOUNDATION" == success && "$UNITS" == success && "$UI" == success ]]
