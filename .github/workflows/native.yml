name: Native checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ${{ fromJSON(vars.NATIVE_RUNNER || '["xcode-27"]') }}
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      IOS_SLICE: ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Toolchain preflight
        run: |
          xcodebuild -version
          python3 - <<'PY'
          import re, subprocess
          version = subprocess.check_output(['xcodebuild', '-version'], text=True)
          match = re.search(r'Xcode (\d+)\.(\d+)', version)
          if not match or tuple(map(int, match.groups())) < (27, 1):
              raise SystemExit('Xcode 27.1+ required; the selected image must supply pinned 27.2.')
          PY
      - name: Install verified XcodeGen
        run: |
          curl --fail --location --retry 3 https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-release"
          echo "$RUNNER_TEMP/xcodegen-release/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Repository guards
        run: |
          python3 -m unittest discover -s Tests/Tooling -v
          python3 scripts/check-project.py
      - name: Host package suites
        run: scripts/test.sh packages
      - name: App-hosted and launch UI suites on both tier-1 devices
        run: scripts/test.sh simulators
      - name: Release archive and probe guard
        if: ${{ !cancelled() }}
        run: |
          scripts/build-draft.sh archive
