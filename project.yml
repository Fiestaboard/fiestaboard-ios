name: FiestaBoard
options:
  minimumXcodeGenVersion: '2.46.0'
  deploymentTarget:
    iOS: '26.0'
  xcodeVersion: '27.1'
settings:
  base:
    SWIFT_VERSION: '6.0'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
targets:
  FiestaBoardKit:
    type: framework
    platform: iOS
    sources:
      - path: Packages/FiestaBoardKit/Sources/FiestaBoardKit
        excludes: [DemoFixtures]
      - path: App/PackageResources.swift
      - path: Packages/FiestaBoardKit/Sources/FiestaBoardKit/DemoFixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fiestaboard.ios.draft.core
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FiestaBoardDocuments
  FiestaBoardAppState:
    type: framework
    platform: iOS
    sources: [Packages/FiestaBoardAppState/Sources/FiestaBoardAppState]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fiestaboard.ios.draft.state
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FiestaBoardKit
  FiestaBoardDocuments:
    type: framework
    platform: iOS
    sources: [Packages/FiestaBoardDocuments/Sources/FiestaBoardDocuments]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fiestaboard.ios.draft.documents
        GENERATE_INFOPLIST_FILE: YES
  FiestaBoardEditorState:
    type: framework
    platform: iOS
    sources: [Packages/FiestaBoardEditorState/Sources/FiestaBoardEditorState]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fiestaboard.ios.draft.editorstate
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FiestaBoardKit
      - target: FiestaBoardDocuments
  FiestaBoard:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [PackageResources.swift]
      - path: ThirdPartyNotices/FiestaBoardTV-MIT.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fiestaboard.ios.draft
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        SUPPORTS_MACCATALYST: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - target: FiestaBoardKit
      - target: FiestaBoardAppState
      - target: FiestaBoardDocuments
      - target: FiestaBoardEditorState
  FiestaBoardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
        excludes: [fixture_server.py]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fiestaboard.ios.draft.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FiestaBoard
schemes:
  FiestaBoard:
    build:
      targets:
        FiestaBoard: all
        FiestaBoardUITests: [test]
    run:
      commandLineArguments:
        '--demo': false
    test:
      targets: [FiestaBoardUITests]
    profile:
      config: Release
      commandLineArguments:
        '--demo': false
    archive:
      config: Release
  FiestaBoard Demo:
    build:
      targets:
        FiestaBoard: all
        FiestaBoardUITests: [test]
    run:
      commandLineArguments:
        '--demo': true
    test:
      targets: [FiestaBoardUITests]
    profile:
      config: Release
      commandLineArguments:
        '--demo': false
    archive:
      config: Release
  FiestaBoard Device Test:
    build:
      targets:
        FiestaBoard: all
    run:
      config: Debug
      debugEnabled: false
      commandLineArguments:
        '--demo': false
    profile:
      config: Release
    archive:
      config: Release
