name: FiestaBoard
options:
  minimumXcodeGenVersion: '2.46.0'
  deploymentTarget:
    iOS: '26.0'
  xcodeVersion: '27.1'
settings:
  base:
    SWIFT_VERSION: '6.0'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
targets:
  FiestaBoardKit:
    type: framework
    platform: iOS
    sources:
      - path: Packages/FiestaBoardKit/Sources/FiestaBoardKit
      - path: App/PackageResources.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fiestaboard.ios.draft.core
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FiestaBoardDocuments
  FiestaBoardRender:
    type: framework
    platform: iOS
    sources:
      - path: Packages/FiestaBoardRender/Sources/FiestaBoardRender
        excludes: [RenderAssets]
      - path: App/PackageResources.swift
      - path: Packages/FiestaBoardRender/Sources/FiestaBoardRender/RenderAssets
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fiestaboard.ios.draft.render
        GENERATE_INFOPLIST_FILE: YES
  FiestaBoardRenderTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Packages/FiestaBoardRender/Tests/FiestaBoardRenderTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fiestaboard.ios.draft.render.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FiestaBoardRender
  FiestaBoardAppState:
    type: framework
    platform: iOS
    sources: [Packages/FiestaBoardAppState/Sources/FiestaBoardAppState]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fiestaboard.ios.draft.state
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FiestaBoardKit
      - target: FiestaBoardRender
  FiestaBoardDocuments:
    type: framework
    platform: iOS
    sources: [Packages/FiestaBoardDocuments/Sources/FiestaBoardDocuments]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fiestaboard.ios.draft.documents
        GENERATE_INFOPLIST_FILE: YES
  FiestaBoardEditorState:
    type: framework
    platform: iOS
    sources: [Packages/FiestaBoardEditorState/Sources/FiestaBoardEditorState]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fiestaboard.ios.draft.editorstate
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FiestaBoardKit
      - target: FiestaBoardDocuments
  FiestaBoard:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [PackageResources.swift]
      - path: ThirdPartyNotices/FiestaBoardTV-MIT.txt
        buildPhase: resources
      - path: ThirdPartyNotices/SplineSansMono-OFL.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fiestaboard.ios.draft
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Tests/Support/Simulator.entitlements
        SUPPORTS_MACCATALYST: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - target: FiestaBoardKit
      - target: FiestaBoardAppState
      - target: FiestaBoardDocuments
      - target: FiestaBoardEditorState
      - target: FiestaBoardRender
  FiestaBoardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
        excludes: ["*.py", "__pycache__"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fiestaboard.ios.draft.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FiestaBoard
  FiestaBoardAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AppTests
      - path: Tests/__Snapshots__/iOS27
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fiestaboard.ios.draft.apptests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FiestaBoard.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FiestaBoard
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: FiestaBoard
schemes:
  FiestaBoard:
    build:
      targets:
        FiestaBoard: all
        FiestaBoardUITests: [test]
        FiestaBoardRenderTests: [test]
        FiestaBoardAppTests: [test]
    test:
      targets: [FiestaBoardUITests, FiestaBoardRenderTests, FiestaBoardAppTests]
    profile:
      config: Release
    archive:
      config: Release
  FiestaBoard Device Test:
    build:
      targets:
        FiestaBoard: all
    run:
      config: Debug
      debugEnabled: false
    profile:
      config: Release
    archive:
      config: Release
